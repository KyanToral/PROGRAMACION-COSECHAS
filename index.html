<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de Cosechas — Santa Fe</title>
<style>
  :root{
    --bg:#F4F6F9; --card:#FFFFFF; --bg2:#EEF2F7; --border:#D8E3EE;
    --hgrad1:#1F4E79; --hgrad2:#2471A3; --hgrad3:#1A3F63;
    --teal:#007A68; --teal-l:#00C9A7; --blue:#1A6EA8; --amber:#D97B1A; --red:#C0303B;
    --text:#1C2B3A; --muted:#6B859E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num{font-family:'Barlow Condensed',system-ui,sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  .app{max-width:1000px; margin:0 auto; padding:0 0 60px;}

  header.top{
    background:linear-gradient(120deg, var(--hgrad1), var(--hgrad2) 55%, var(--hgrad3));
    color:#fff; padding:22px 20px 26px; position:relative; overflow:hidden;
  }
  header.top::after{
    content:""; position:absolute; right:-40px; top:-60px; width:220px; height:220px;
    border-radius:50%; background:rgba(255,255,255,0.06);
  }
  header.top h1{margin:0 0 2px; font-size:26px; font-weight:700; letter-spacing:.3px;}
  header.top .sub{font-size:12.5px; color:#C8E0F4; letter-spacing:.5px; text-transform:uppercase; font-weight:600;}
  .sitio-pill{
    display:inline-block; margin-top:10px; background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:20px; letter-spacing:.4px;
  }

  .logo-wrap{
    display:inline-block; background:#fff; border-radius:10px; padding:6px 12px 4px;
    margin-bottom:8px; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .logo{height:38px; display:block;}
  .status-bar{padding:14px 20px 0;}
  .loading{color:var(--muted); font-size:13px; padding:20px; text-align:center;}

  .daytabs{
    display:flex; gap:8px; overflow-x:auto; padding:16px 20px 4px; scrollbar-width:thin;
  }
  .daytab{
    flex:0 0 auto; padding:8px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); font-size:12.5px; font-weight:600; color:var(--muted);
    cursor:pointer; white-space:nowrap; transition:all .15s ease; position:relative;
  }
  .daytab.active{background:var(--hgrad1); color:#fff; border-color:var(--hgrad1);}
  .daytab.all-weeks-tab{border-color:var(--amber); color:var(--amber);}
  .daytab.all-weeks-tab.active{background:var(--amber); color:#fff; border-color:var(--amber);}
  .daytab .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; background:var(--amber);}
  .daytab.closed .dot{background:var(--teal);}
  .daytab.active .dot{background:#fff;}
  .add-day{
    flex:0 0 auto; padding:8px 14px; border-radius:10px; border:1px dashed var(--blue);
    background:transparent; color:var(--blue); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .tab-del{
    display:inline-flex; align-items:center; justify-content:center;
    margin-left:8px; width:16px; height:16px; border-radius:50%;
    color:var(--muted); font-size:10px; line-height:1; cursor:pointer;
  }
  .tab-del:hover{background:rgba(192,48,59,.15); color:var(--red);}
  .daytab.active .tab-del{color:rgba(255,255,255,.75);}
  .daytab.active .tab-del:hover{background:rgba(255,255,255,.2); color:#fff;}

  .mode-toggle{display:flex; gap:8px; padding:16px 20px 0; flex-wrap:wrap; align-items:center;}
  .mode-btn{
    padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card);
    font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .mode-btn.active{background:var(--hgrad1); color:#fff; border-color:var(--hgrad1);}
  .date-jump-wrap{display:flex; align-items:center; gap:6px; margin-left:auto;}
  .date-jump-wrap label{font-size:11.5px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .date-jump-wrap input[type="date"]{
    width:auto; padding:7px 8px; font-size:12.5px; border-radius:8px;
  }

  .summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; padding:16px 20px 4px;}
  .summary-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .summary-card .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .summary-card .value{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--hgrad1);}

  .week-label{padding:6px 20px 0; font-size:13px; color:var(--muted); font-weight:600;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin:16px 20px; overflow:hidden;
  }
  .card-head{
    padding:16px 18px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;
  }
  .card-head h2{margin:0; font-size:20px; font-weight:600; text-transform:capitalize;}
  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.3px;
  }
  .badge.open{background:rgba(217,123,26,.12); color:#9A5610;}
  .badge.closed{background:rgba(0,122,104,.1); color:#005A4D;}

  table{width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed;}
  colgroup .col-est{width:60px;}
  thead th{
    background:var(--hgrad1); color:#C8E0F4; text-align:center; padding:10px 10px;
    font-size:11px; letter-spacing:.4px; text-transform:uppercase; font-weight:600;
  }
  tbody td{padding:8px 10px; border-bottom:1px solid var(--border); text-align:center;}
  tbody tr:hover{background:#F0F7FF;}
  tfoot td{
    background:var(--hgrad1); color:#fff; font-weight:700; padding:10px; text-align:center;
    font-family:'Barlow Condensed',sans-serif; font-size:15px;
  }
  input, select{
    width:100%; border:1px solid var(--border); border-radius:6px; padding:6px 7px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--text); text-align:center;
  }
  input:focus, select:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 2px rgba(26,110,168,.15);}
  input:disabled, select:disabled{background:var(--bg2); color:var(--muted); border-color:var(--border);}
  .num-cell{width:70px;}
  .obs-cell{min-width:120px;}
  .tipo-DIA{color:var(--amber); font-weight:700;}
  .tipo-NOCHE{color:var(--blue); font-weight:700;}
  .del-btn{
    background:none; border:none; color:var(--red); cursor:pointer; font-size:16px;
    padding:2px 6px; border-radius:6px; line-height:1;
  }
  .del-btn:hover{background:rgba(192,48,59,.08);}
  input.dup-est{border-color:var(--red) !important; background:rgba(192,48,59,.07) !important;}
  .dup-msg{
    display:block; font-size:9.5px; color:var(--red); font-weight:700; margin-top:3px;
    line-height:1.2;
  }

  .card-actions{
    padding:14px 18px; display:flex; gap:10px; flex-wrap:wrap; border-top:1px solid var(--border);
    background:var(--bg2);
  }
  button.btn{
    border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:opacity .15s;
  }
  button.btn:hover{opacity:.9;}
  .btn-add{background:var(--card); border:1px solid var(--border) !important; color:var(--blue);}
  .btn-finish{background:linear-gradient(90deg, var(--teal), var(--teal-l)); color:#fff;}
  .btn-reopen{background:var(--amber); color:#fff;}
  .btn-delete{background:#fff; border:1px solid var(--red) !important; color:var(--red);}
  .btn-delete-confirm{background:var(--red); color:#fff;}
  .btn-secondary{background:transparent; border:1px solid var(--border) !important; color:var(--muted);}

  .empty-state{padding:30px 18px; text-align:center; color:var(--muted); font-size:13.5px;}

  .stats-row{display:flex; gap:10px; padding:0 18px 14px; flex-wrap:wrap;}
  .stat-chip{
    background:var(--bg2); border-radius:8px; padding:6px 12px; font-size:11.5px; color:var(--muted);
    font-weight:600;
  }
  .stat-chip b{color:var(--text); font-family:'Barlow Condensed',sans-serif; font-size:15px; margin-right:3px;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(20,30,45,.45); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{background:#fff; border-radius:14px; padding:22px; max-width:340px; width:100%;}
  .modal h3{margin:0 0 12px; font-size:18px;}
  .modal label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin:10px 0 4px;}
  .modal-actions{display:flex; gap:8px; margin-top:18px; justify-content:flex-end;}

  @media (max-width:640px){
    header.top{padding:18px 16px 22px;}
    header.top h1{font-size:21px;}
    header.top .sub{font-size:11px;}
    .app{padding-bottom:40px;}
    .mode-toggle{padding:14px 14px 0;}
    .mode-btn{flex:1 1 auto; padding:10px; font-size:12px;}
    .date-jump-wrap{width:100%; margin-left:0; justify-content:space-between;}
    .date-jump-wrap input[type="date"]{flex:1;}
    .daytabs{padding:12px 14px 4px;}
    .daytab{padding:10px 12px;}
    .tab-del{
      width:26px; height:26px; margin-left:6px; margin-right:-6px;
      font-size:12px;
    }
    .card{margin:12px 14px;}
    .card-head{padding:14px;}
    .card-head h2{font-size:17px;}
    .stats-row{padding:0 14px 12px;}
    .card-actions{padding:12px 14px; flex-direction:column;}
    .card-actions .btn{width:100%; padding:12px; font-size:13.5px;}
    .summary-grid{grid-template-columns:repeat(2,1fr); padding:12px 14px 4px;}
    .summary-card{padding:12px;}
    .summary-card .value{font-size:22px;}
    .week-label{padding:6px 14px 0;}
    input, select{min-height:40px;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{
      border-bottom:2px solid var(--border); padding:10px 4px; position:relative;
    }
    tbody td{
      border-bottom:none; padding:5px 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .dup-msg{flex:0 0 100%; margin-left:98px; margin-top:2px;}
    .logo{height:32px;}
    .logo-wrap{padding:5px 10px 3px;}
    tbody td::before{
      content:attr(data-label); flex:0 0 90px; font-size:10.5px; color:var(--muted);
      text-transform:uppercase; font-weight:700; letter-spacing:.3px;
    }
    .del-btn{position:absolute; top:8px; right:4px;}
    tfoot{display:none;}
    .mobile-totals{display:block !important;}
  }
  .mobile-totals{display:none; padding:12px 18px; background:var(--hgrad1); color:#fff; font-size:13px;}
  .mobile-totals span{margin-right:14px; font-weight:700;}
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2,9); }

function fmtDayLabel(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const s = d.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s;
}
function fmtShort(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es-MX', {weekday:'short', day:'numeric', month:'short'}).replace('.','');
}
function nextDate(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function normalizeState(raw){
  const s = raw || {};
  const norm = { days:{}, order: Array.isArray(s.order) ? s.order : [], activeDay: s.activeDay || null };
  const daysObj = s.days || {};
  Object.keys(daysObj).forEach(d=>{
    const day = daysObj[d] || {};
    norm.days[d] = {
      status: day.status || 'abierto',
      rows: Array.isArray(day.rows) ? day.rows : []
    };
  });
  return norm;
}

function initFirebase(){
  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    stateRef = ref(db, 'cosechasState');
    onValue(stateRef, snap=>{
      const val = snap.val();
      const incoming = normalizeState(val);
      const incomingStr = JSON.stringify(incoming);
      const currentStr = JSON.stringify(state);
      if(incomingStr !== currentStr){
        state = incoming;
        render();
      }
    }, err=>{
      console.error('Error leyendo de Firebase', err);
      if(!state){ state = { days:{}, order:[], activeDay:null }; render(); }
    });
  }catch(e){
    console.error('Error al iniciar Firebase', e);
    state = { days:{}, order:[], activeDay:null };
    render();
  }
}

async function saveState(){
  try{
    if(stateRef) await set(stateRef, state);
  }catch(e){
    console.error('Error guardando en Firebase', e);
  }
}

function addDay(dateStr){
  if(state.days[dateStr]) return;
  state.days[dateStr] = { status:'abierto', rows:[] };
  state.order.push(dateStr);
  state.order.sort();
  state.activeDay = dateStr;
}

function ensureFirstDay(){
  let changed = false;
  if(state.order.length === 0){
    addDay(todayStr());
    changed = true;
  }
  if(!state.activeDay){ state.activeDay = state.order[0]; changed = true; }
  if(changed) saveState();
}

function addRow(dateStr){
  state.days[dateStr].rows.push({
    id: uid(), est:'', has:'', peso:'', biomasa:'', tipo:'DIA', obs:''
  });
  render(); saveState();
}

function updateRow(dateStr, id, field, value){
  const row = state.days[dateStr].rows.find(r=>r.id===id);
  if(row){ row[field] = value; }
  saveState();
}

function findDuplicateEst(estRaw, excludeDateStr, excludeRowId){
  const est = (estRaw||'').trim().toUpperCase();
  if(!est) return null;
  for(const d of state.order){
    for(const r of state.days[d].rows){
      if(d===excludeDateStr && r.id===excludeRowId) continue;
      if((r.est||'').trim().toUpperCase() === est){
        return d;
      }
    }
  }
  return null;
}

function recheckEstDuplicates(dateStr){
  const day = state.days[dateStr];
  if(!day) return;
  day.rows.forEach(r=>{
    const input = document.getElementById('est-'+r.id);
    const msgEl = document.getElementById('estmsg-'+r.id);
    const dupDate = findDuplicateEst(r.est, dateStr, r.id);
    if(input) input.classList.toggle('dup-est', !!dupDate);
    if(msgEl) msgEl.textContent = dupDate ? `Repetido: también capturado el ${fmtShort(dupDate)}` : '';
  });
}

function handleEstInput(input, dateStr, rowId){
  updateRow(dateStr, rowId, 'est', input.value);
  recheckEstDuplicates(dateStr);
  autofillHas(dateStr, rowId, input.value);
}

function autofillHas(dateStr, rowId, estRaw){
  const key = (estRaw||'').trim().toUpperCase();
  const has = ESTANQUE_HAS[key];
  if(has === undefined) return;
  const hasInput = document.getElementById('has-'+rowId);
  const formatted = Number(has).toFixed(1);
  if(hasInput) hasInput.value = formatted;
  updateRow(dateStr, rowId, 'has', formatted);
  updateComputedFields(dateStr);
}

function formatDecimal(input, dateStr, id, field){
  const v = parseFloat(input.value);
  if(isNaN(v)) return;
  const formatted = v.toFixed(1);
  input.value = formatted;
  updateRow(dateStr, id, field, formatted);
  updateComputedFields(dateStr);
}

function formatBiomasaDisplay(value){
  if(value==='' || value===null || value===undefined) return '';
  const v = parseFloat(String(value).replace(/,/g,''));
  if(isNaN(v)) return '';
  return v % 1 === 0 ? v.toLocaleString('es-MX') : v.toLocaleString('es-MX', {minimumFractionDigits:1, maximumFractionDigits:1});
}

function formatBiomasaInput(input, dateStr, id){
  const raw = input.value.replace(/,/g,'');
  const v = parseFloat(raw);
  if(isNaN(v)){ input.value=''; updateRow(dateStr,id,'biomasa',''); updateComputedFields(dateStr); return; }
  input.value = formatBiomasaDisplay(v);
  updateRow(dateStr, id, 'biomasa', String(v));
  updateComputedFields(dateStr);
}

function changeTipo(dateStr, id, value){
  updateRow(dateStr, id, 'tipo', value);
  const day = state.days[dateStr];
  day.rows.sort((a,b)=>{
    if(a.tipo===b.tipo) return 0;
    return a.tipo==='DIA' ? -1 : 1;
  });
  render(); saveState();
}

function removeRow(dateStr, id){
  const day = state.days[dateStr];
  day.rows = day.rows.filter(r=>r.id!==id);
  render(); saveState();
}

function finishDay(dateStr){
  state.days[dateStr].status = 'cerrado';
  const idx = state.order.indexOf(dateStr);
  if(idx === state.order.length - 1){
    const nd = nextDate(dateStr);
    addDay(nd);
  } else {
    state.activeDay = dateStr;
  }
  render(); saveState();
}

function reopenDay(dateStr){
  state.days[dateStr].status = 'abierto';
  state.activeDay = dateStr;
  render(); saveState();
}

function deleteDay(dateStr){
  const label = fmtDayLabel(dateStr);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>Eliminar día</h3>
      <p style="font-size:13.5px; color:var(--muted); margin:0;">¿Eliminar <b style="color:var(--text);">${label}</b> del programa? Esto borrará todos sus estanques capturados y no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-delete-confirm" onclick="confirmDeleteDay('${dateStr}')">Sí, eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
}

function confirmDeleteDay(dateStr){
  const idx = state.order.indexOf(dateStr);
  delete state.days[dateStr];
  state.order = state.order.filter(d=>d!==dateStr);

  if(state.activeDay === dateStr){
    if(state.order.length > 0){
      const nextIdx = Math.min(idx, state.order.length - 1);
      state.activeDay = state.order[nextIdx];
    } else {
      state.activeDay = null;
    }
  }

  ensureFirstDay();
  closeModal();
  render(); saveState();
}

function selectDay(dateStr){
  state.activeDay = dateStr;
  render();
}

function computeTotals(rows){
  rows = rows || [];
  let sumHas=0, sumBiomasa=0, nDia=0, nNoche=0, sumPeso=0, nPeso=0;
  rows.forEach(r=>{
    sumHas += parseFloat(r.has)||0;
    sumBiomasa += parseFloat(r.biomasa)||0;
    if(r.tipo==='DIA') nDia++; else nNoche++;
    const p = parseFloat(r.peso);
    if(p>0){ sumPeso += p; nPeso++; }
  });
  const biomasaHa = sumHas>0 ? (sumBiomasa/sumHas) : 0;
  const avgPeso = nPeso>0 ? (sumPeso/nPeso) : 0;
  return {sumHas, sumBiomasa, biomasaHa, nDia, nNoche, count: rows.length, avgPeso};
}

function mondayOf(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();
  const diff = dow===0 ? -6 : 1-dow;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function sundayOf(mondayStr){
  const d = new Date(mondayStr + 'T12:00:00');
  d.setDate(d.getDate()+6);
  return d.toISOString().slice(0,10);
}
function fmtWeekLabel(monday){
  const d1 = new Date(monday + 'T12:00:00');
  const d2 = new Date(sundayOf(monday) + 'T12:00:00');
  const p1 = d1.toLocaleDateString('es-MX', {day:'numeric'});
  const p2 = d2.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});
  return `Semana del ${p1} al ${p2}`;
}
function getWeeks(){
  const map = {};
  state.order.forEach(d=>{
    const mon = mondayOf(d);
    if(!map[mon]) map[mon] = [];
    map[mon].push(d);
  });
  return Object.keys(map).sort().map(mon=>({monday:mon, days:map[mon].sort()}));
}
function computeWeekTotals(days){
  let sumHas=0, sumBiomasa=0, sumPeso=0, nPeso=0, count=0;
  days.forEach(d=>{
    state.days[d].rows.forEach(r=>{
      sumHas += parseFloat(r.has)||0;
      sumBiomasa += parseFloat(r.biomasa)||0;
      const p = parseFloat(r.peso);
      if(p>0){ sumPeso += p; nPeso++; }
      count++;
    });
  });
  const biomasaHa = sumHas>0 ? (sumBiomasa/sumHas) : 0;
  const avgPeso = nPeso>0 ? (sumPeso/nPeso) : 0;
  return {sumHas, sumBiomasa, avgPeso, biomasaHa, count};
}
function setViewMode(mode){
  viewMode = mode;
  if(mode==='week'){ selectedWeek = mondayOf(state.activeDay); }
  render();
}
function selectWeek(monday){
  selectedWeek = monday;
  render();
}
function goToDate(dateStr){
  if(!dateStr) return;
  viewMode = 'day';
  if(!state.days[dateStr]){
    addDay(dateStr);
  } else {
    state.activeDay = dateStr;
  }
  render(); saveState();
}

function updateComputedFields(dateStr){
  const day = state.days[dateStr];
  if(!day) return;
  const totals = computeTotals(day.rows);

  day.rows.forEach(r=>{
    const cell = document.getElementById('bh-'+r.id);
    if(cell){
      const h = parseFloat(r.has), b = parseFloat(r.biomasa);
      cell.textContent = (h>0 && b>0) ? Math.round(b/h).toLocaleString('es-MX') : '';
    }
  });

  const set = (id, text) => { const el = document.getElementById(id); if(el) el.textContent = text; };
  set('tot-has', totals.sumHas.toFixed(1));
  set('tot-peso', totals.avgPeso.toFixed(1));
  set('tot-biomasa', formatBiomasaDisplay(totals.sumBiomasa));
  set('tot-biomasaha', Math.round(totals.biomasaHa).toLocaleString('es-MX'));
  set('tot-tipo', totals.nDia+'D / '+totals.nNoche+'N');
  set('m-has', 'HAS: '+totals.sumHas.toFixed(1));
  set('m-peso', 'PESO: '+totals.avgPeso.toFixed(1)+'g');
  set('m-biomasa', 'BIOMASA: '+formatBiomasaDisplay(totals.sumBiomasa)+' kg');
  set('m-tipo', totals.nDia+'D / '+totals.nNoche+'N');
  set('stat-count', totals.count);
  set('stat-dia', totals.nDia);
  set('stat-noche', totals.nNoche);
  set('stat-biomasa', formatBiomasaDisplay(totals.sumBiomasa));
}

function renderDayView(){
  const activeDay = state.activeDay;
  const day = state.days[activeDay];
  const totals = computeTotals(day.rows);

  const tabsHtml = state.order.map(d=>{
    const dd = state.days[d];
    const cls = 'daytab' + (d===activeDay?' active':'') + (dd.status==='cerrado'?' closed':'');
    return `<div class="${cls}" onclick="selectDay('${d}')"><span class="dot"></span>${fmtShort(d)}<span class="tab-del" onclick="event.stopPropagation(); deleteDay('${d}')" title="Eliminar día">✕</span></div>`;
  }).join('');

  const rowsHtml = day.rows.map(r=>{
    const biomasaHa = (parseFloat(r.has)>0 && parseFloat(r.biomasa)>0)
      ? Math.round(parseFloat(r.biomasa)/parseFloat(r.has)).toLocaleString('es-MX') : '';
    const disabled = day.status==='cerrado' ? 'disabled' : '';
    const dupDate = findDuplicateEst(r.est, activeDay, r.id);
    const dupClass = dupDate ? ' dup-est' : '';
    const dupMsg = dupDate ? `Repetido: también capturado el ${fmtShort(dupDate)}` : '';
    return `
    <tr>
      <td data-label="Est">
        <input id="est-${r.id}" class="${dupClass}" ${disabled} value="${r.est}" oninput="handleEstInput(this,'${activeDay}','${r.id}')">
        <span id="estmsg-${r.id}" class="dup-msg">${dupMsg}</span>
      </td>
      <td data-label="Has" class="num-cell"><input id="has-${r.id}" ${disabled} type="number" step="0.1" value="${r.has}" oninput="updateRow('${activeDay}','${r.id}','has',this.value); updateComputedFields('${activeDay}')" onblur="formatDecimal(this,'${activeDay}','${r.id}','has')"></td>
      <td data-label="Peso (gr)" class="num-cell"><input ${disabled} type="number" step="0.1" value="${r.peso}" oninput="updateRow('${activeDay}','${r.id}','peso',this.value); updateComputedFields('${activeDay}')" onblur="formatDecimal(this,'${activeDay}','${r.id}','peso')"></td>
      <td data-label="Biomasa (kg)" class="num-cell"><input ${disabled} type="text" inputmode="decimal" value="${formatBiomasaDisplay(r.biomasa)}" oninput="updateRow('${activeDay}','${r.id}','biomasa',this.value.replace(/,/g,'')); updateComputedFields('${activeDay}')" onfocus="this.value=this.value.replace(/,/g,'')" onblur="formatBiomasaInput(this,'${activeDay}','${r.id}')"></td>
      <td data-label="Biomasa/ha" id="bh-${r.id}">${biomasaHa}</td>
      <td data-label="Tipo Cosecha">
        <select ${disabled} class="tipo-${r.tipo}" id="tipo-${r.id}" onchange="changeTipo('${activeDay}','${r.id}',this.value)">
          <option value="DIA" ${r.tipo==='DIA'?'selected':''}>Día</option>
          <option value="NOCHE" ${r.tipo==='NOCHE'?'selected':''}>Noche</option>
        </select>
      </td>
      <td data-label="Obs" class="obs-cell"><input ${disabled} value="${r.obs}" placeholder="—" oninput="updateRow('${activeDay}','${r.id}','obs',this.value)"></td>
      <td>${day.status==='abierto' ? `<button class="del-btn" onclick="removeRow('${activeDay}','${r.id}')">✕</button>` : ''}</td>
    </tr>`;
  }).join('');

  const emptyHtml = day.rows.length===0 ? `<div class="empty-state">Aún no hay estanques capturados para este día. Usa "+ Agregar estanque" para empezar.</div>` : '';

  const tableHtml = day.rows.length===0 ? '' : `
    <table>
      <colgroup>
        <col style="width:85px"><col style="width:85px"><col style="width:80px">
        <col style="width:90px"><col style="width:90px"><col style="width:90px">
        <col><col style="width:32px">
      </colgroup>
      <thead>
        <tr><th>Est</th><th>Has</th><th>Peso (gr)</th><th>Biomasa (kg)</th><th>Biomasa/ha</th><th>Tipo Cosecha</th><th>Obs</th><th></th></tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
      <tfoot>
        <tr>
          <td>TOTAL</td>
          <td id="tot-has">${totals.sumHas.toFixed(1)}</td>
          <td id="tot-peso">${totals.avgPeso.toFixed(1)}</td>
          <td id="tot-biomasa">${formatBiomasaDisplay(totals.sumBiomasa)}</td>
          <td id="tot-biomasaha">${Math.round(totals.biomasaHa).toLocaleString('es-MX')}</td>
          <td id="tot-tipo">${totals.nDia}D / ${totals.nNoche}N</td>
          <td></td><td></td>
        </tr>
      </tfoot>
    </table>
    <div class="mobile-totals">
      <span id="m-has">HAS: ${totals.sumHas.toFixed(1)}</span>
      <span id="m-peso">PESO: ${totals.avgPeso.toFixed(1)}g</span>
      <span id="m-biomasa">BIOMASA: ${formatBiomasaDisplay(totals.sumBiomasa)} kg</span>
      <span id="m-tipo">${totals.nDia}D / ${totals.nNoche}N</span>
    </div>
  `;

  return `
    <div class="daytabs">
      ${tabsHtml}
      <div class="add-day" onclick="openAddDayModal()">+ Nuevo día</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>${fmtDayLabel(activeDay)}</h2>
        <span class="badge ${day.status==='cerrado'?'closed':'open'}">${day.status==='cerrado'?'Cerrado':'En captura'}</span>
      </div>
      <div class="stats-row">
        <div class="stat-chip"><b id="stat-count">${totals.count}</b>estanques</div>
        <div class="stat-chip"><b id="stat-dia">${totals.nDia}</b>día</div>
        <div class="stat-chip"><b id="stat-noche">${totals.nNoche}</b>noche</div>
        <div class="stat-chip"><b id="stat-biomasa">${formatBiomasaDisplay(totals.sumBiomasa)}</b>kg biomasa</div>
      </div>
      ${tableHtml}
      ${emptyHtml}
      <div class="card-actions">
        ${day.status==='abierto' ? `<button class="btn btn-add" onclick="addRow('${activeDay}')">+ Agregar estanque</button>` : ''}
        ${day.status==='abierto'
          ? `<button class="btn btn-finish" onclick="finishDay('${activeDay}')">Finalizar día y pasar al siguiente →</button>`
          : `<button class="btn btn-reopen" onclick="reopenDay('${activeDay}')">Reabrir para modificar</button>
             <button class="btn btn-delete" onclick="deleteDay('${activeDay}')">🗑 Eliminar día</button>`}
      </div>
    </div>
  `;
}

function renderReadOnlyDayTable(dateStr){
  const day = state.days[dateStr];
  const totals = computeTotals(day.rows);
  if(day.rows.length===0){
    return `
      <div class="card week-day-card">
        <div class="card-head">
          <h2>${fmtDayLabel(dateStr)}</h2>
          <span class="badge ${day.status==='cerrado'?'closed':'open'}">${day.status==='cerrado'?'Cerrado':'En captura'}</span>
        </div>
        <div class="empty-state">Sin estanques capturados.</div>
      </div>`;
  }
  const rowsHtml = day.rows.map(r=>{
    const biomasaHa = (parseFloat(r.has)>0 && parseFloat(r.biomasa)>0)
      ? Math.round(parseFloat(r.biomasa)/parseFloat(r.has)).toLocaleString('es-MX') : '';
    const dupDate = findDuplicateEst(r.est, dateStr, r.id);
    return `
    <tr>
      <td data-label="Est"${dupDate?' style="color:var(--red); font-weight:700;"':''}>${r.est||'—'}</td>
      <td data-label="Has">${r.has||'—'}</td>
      <td data-label="Peso (gr)">${r.peso||'—'}</td>
      <td data-label="Biomasa (kg)">${r.biomasa?formatBiomasaDisplay(r.biomasa):'—'}</td>
      <td data-label="Biomasa/ha">${biomasaHa||'—'}</td>
      <td data-label="Tipo Cosecha" class="tipo-${r.tipo}">${r.tipo==='DIA'?'Día':'Noche'}</td>
      <td data-label="Obs">${r.obs||'—'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="card week-day-card">
      <div class="card-head">
        <h2>${fmtDayLabel(dateStr)}</h2>
        <span class="badge ${day.status==='cerrado'?'closed':'open'}">${day.status==='cerrado'?'Cerrado':'En captura'}</span>
      </div>
      <table>
        <colgroup>
          <col style="width:85px"><col style="width:85px"><col style="width:80px">
          <col style="width:90px"><col style="width:90px"><col style="width:90px"><col>
        </colgroup>
        <thead>
          <tr><th>Est</th><th>Has</th><th>Peso (gr)</th><th>Biomasa (kg)</th><th>Biomasa/ha</th><th>Tipo Cosecha</th><th>Obs</th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          <tr>
            <td>TOTAL</td>
            <td>${totals.sumHas.toFixed(1)}</td>
            <td>${totals.avgPeso.toFixed(1)}</td>
            <td>${formatBiomasaDisplay(totals.sumBiomasa)}</td>
            <td>${Math.round(totals.biomasaHa).toLocaleString('es-MX')}</td>
            <td>${totals.nDia}D / ${totals.nNoche}N</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

function renderWeekView(){
  const weeks = getWeeks();
  if(weeks.length===0 || !selectedWeek){
    return `<div class="empty-state">Aún no hay días capturados.</div>`;
  }
  const weekTabsHtml = weeks.map(w=>{
    const cls = 'daytab' + (w.monday===selectedWeek ? ' active' : '');
    return `<div class="${cls}" onclick="selectWeek('${w.monday}')">${fmtWeekLabel(w.monday).replace('Semana del ','')}</div>`;
  }).join('') + `<div class="daytab all-weeks-tab${selectedWeek==='ALL'?' active':''}" onclick="selectWeek('ALL')">Todas las semanas</div>`;

  if(selectedWeek==='ALL'){
    const allDays = weeks.reduce((acc,w)=>acc.concat(w.days),[]);
    const wt = computeWeekTotals(allDays);
    const groupsHtml = weeks.map(w=>w.days.map(d=>renderReadOnlyDayTable(d)).join('')).join('');

    return `
      <div class="daytabs">${weekTabsHtml}</div>
      <div class="week-label">Todas las semanas capturadas</div>
      <div class="summary-grid">
        <div class="summary-card"><div class="label">Total estanques</div><div class="value">${wt.count}</div></div>
        <div class="summary-card"><div class="label">Sup. has</div><div class="value">${wt.sumHas.toFixed(1)}</div></div>
        <div class="summary-card"><div class="label">Peso g (prom.)</div><div class="value">${wt.avgPeso.toFixed(1)}</div></div>
        <div class="summary-card"><div class="label">Biomasa total kg</div><div class="value">${formatBiomasaDisplay(wt.sumBiomasa)}</div></div>
        <div class="summary-card"><div class="label">Biomasa kg/ha</div><div class="value">${Math.round(wt.biomasaHa).toLocaleString('es-MX')}</div></div>
      </div>
      ${groupsHtml}
    `;
  }

  const currentWeek = weeks.find(w=>w.monday===selectedWeek) || weeks[weeks.length-1];
  const wt = computeWeekTotals(currentWeek.days);
  const daysHtml = currentWeek.days.map(d=>renderReadOnlyDayTable(d)).join('');

  return `
    <div class="daytabs">${weekTabsHtml}</div>
    <div class="week-label">${fmtWeekLabel(currentWeek.monday)}</div>
    <div class="summary-grid">
      <div class="summary-card"><div class="label">Total estanques</div><div class="value">${wt.count}</div></div>
      <div class="summary-card"><div class="label">Sup. has</div><div class="value">${wt.sumHas.toFixed(1)}</div></div>
      <div class="summary-card"><div class="label">Peso g (prom.)</div><div class="value">${wt.avgPeso.toFixed(1)}</div></div>
      <div class="summary-card"><div class="label">Biomasa total kg</div><div class="value">${formatBiomasaDisplay(wt.sumBiomasa)}</div></div>
      <div class="summary-card"><div class="label">Biomasa kg/ha</div><div class="value">${Math.round(wt.biomasaHa).toLocaleString('es-MX')}</div></div>
    </div>
    ${daysHtml}
  `;
}

function render(){
  ensureFirstDay();
  const root = document.getElementById('root');
  const modeToggleHtml = `
    <div class="mode-toggle">
      <button class="mode-btn ${viewMode==='day'?'active':''}" onclick="setViewMode('day')">Por día</button>
      <button class="mode-btn ${viewMode==='week'?'active':''}" onclick="setViewMode('week')">Vista semanal</button>
      <div class="date-jump-wrap">
        <label>Ir a fecha</label>
        <input type="date" onchange="goToDate(this.value)" value="${state.activeDay||''}">
      </div>
    </div>`;
  root.innerHTML = modeToggleHtml + (viewMode==='week' ? renderWeekView() : renderDayView());
}

function openAddDayModal(){
  const last = state.order[state.order.length-1];
  const suggested = last ? nextDate(last) : todayStr();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>Nuevo día</h3>
      <label>Fecha</label>
      <input type="date" id="newDayInput" value="${suggested}">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-finish" onclick="confirmAddDay()">Crear</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const m = document.querySelector('.modal-bg');
  if(m) m.remove();
}
function confirmAddDay(){
  const val = document.getElementById('newDayInput').value;
  if(val){
    addDay(val);
    render(); saveState();
  }
  closeModal();
}

initFirebase();

window.selectDay = selectDay;
window.addRow = addRow;
window.removeRow = removeRow;
window.updateRow = updateRow;
window.changeTipo = changeTipo;
window.finishDay = finishDay;
window.reopenDay = reopenDay;
window.deleteDay = deleteDay;
window.confirmDeleteDay = confirmDeleteDay;
window.openAddDayModal = openAddDayModal;
window.closeModal = closeModal;
window.confirmAddDay = confirmAddDay;
window.setViewMode = setViewMode;
window.selectWeek = selectWeek;
window.goToDate = goToDate;
window.handleEstInput = handleEstInput;
window.formatDecimal = formatDecimal;
window.formatBiomasaInput = formatBiomasaInput;
window.updateComputedFields = updateComputedFields;
</script>
